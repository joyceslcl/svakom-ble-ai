<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧸 蓝牙中继</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 400px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }
        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
        }
        button:disabled {
            background: #c4b5fd;
            cursor: not-allowed;
        }
        .status {
            margin: 20px 0;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        .ok { background: #d1fae5; color: #065f46; }
        .err { background: #fee2e2; color: #991b1b; }
        .info { background: #e0e7ff; color: #3730a3; }
        label {
            display: block;
            text-align: left;
            margin-top: 12px;
            font-size: 13px;
            color: #374151;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 4px 0 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1>🧸 蓝牙中继</h1>
    
    <label>🌐 中继地址</label>
    <input type="text" id="serverUrl" value="https://svakom-ble-ai-1.onrender.com" placeholder="https://你的服务器.onrender.com">
    
    <label>🔑 密钥</label>
    <input type="text" id="serverSecret" value="200262zll" placeholder="你设的 BRIDGE_SECRET">
    
    <div id="statusBox" class="status info">
        ⏳ 等待连接蓝牙玩具…
    </div>
    
    <button id="connectBtn">🔍 扫描并连接玩具</button>
    
    <div style="margin-top: 16px; font-size: 12px; color: #6b7280;">
        💡 提示：玩具需处于配对模式（灯快闪）<br>
        部分安卓手机需授予 Chrome「位置」权限
    </div>

    <script>
        const statusBox = document.getElementById('statusBox');
        const connectBtn = document.getElementById('connectBtn');
        const serverUrlInput = document.getElementById('serverUrl');
        const serverSecretInput = document.getElementById('serverSecret');

        let device = null;
        let characteristic = null;
        let currentCommand = null; // 当前正在执行的指令
        let keepAliveTimer = null;
        let pollTimer = null;
        let wakeLock = null;

        function setStatus(msg, type) {
            statusBox.textContent = msg;
            statusBox.className = 'status ' + type;
        }

        // 请求屏幕常亮
        async function requestWakeLock() {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log('🔒 屏幕唤醒锁已激活');
            } catch (e) {
                console.warn('⚠️ 唤醒锁失败（不影响功能）:', e);
            }
        }

        // 构建蓝牙命令
        function buildCommand(cmd) {
            if (cmd.type === 'speed') {
                const v = cmd.value || 0;
                return new Uint8Array([0x55, 0x04, 0x00, 0x00, v, v, 0xAA]);
            } else if (cmd.type === 'pattern') {
                const mode = cmd.mode || 1;
                const level = Math.round((cmd.level || 1) * 5);
                return new Uint8Array([0x55, 0x03, 0x00, 0x00, mode, level, 0x00]);
            } else if (cmd.type === 'stop') {
                return new Uint8Array([0x55, 0x04, 0x00, 0x00, 0x00, 0x00, 0xAA]);
            }
            return null;
        }

        // 发送字节到蓝牙
        async function sendRaw(bytes) {
            if (!characteristic) {
                console.warn('⚠️ 特征未连接，跳过发送');
                return;
            }
            try {
                await characteristic.writeValueWithoutResponse(bytes);
                console.log('📤 已发送:', Array.from(bytes).map(b => '0x' + b.toString(16).padStart(2, '0')).join(' '));
            } catch (e) {
                console.error('❌ 发送失败:', e);
            }
        }

        // 执行单条指令
        function executeCommand(cmd) {
            currentCommand = cmd;
            const bytes = buildCommand(cmd);
            if (bytes) {
                sendRaw(bytes);
            }
        }

        // 续命：每 1.5 秒重发当前指令
        function startKeepAlive() {
            stopKeepAlive();
            keepAliveTimer = setInterval(() => {
                if (currentCommand && characteristic) {
                    const bytes = buildCommand(currentCommand);
                    if (bytes) {
                        console.log('🔄 续命发送…');
                        sendRaw(bytes);
                    }
                }
            }, 1500);
        }

        function stopKeepAlive() {
            if (keepAliveTimer) {
                clearInterval(keepAliveTimer);
                keepAliveTimer = null;
            }
        }

        // 轮询服务器取指令
        async function pollServer() {
            if (!characteristic) return;
            const url = serverUrlInput.value.trim();
            const secret = serverSecretInput.value.trim();
            try {
                const resp = await fetch(`${url}/toy-next?secret=${encodeURIComponent(secret)}`);
                const data = await resp.json();
                const cmds = data.commands || [];
                if (cmds.length > 0) {
                    console.log('📥 收到指令:', cmds);
                    // 只执行最后一条
                    const lastCmd = cmds[cmds.length - 1];
                    executeCommand(lastCmd);
                }
            } catch (e) {
                console.warn('⚠️ 轮询失败:', e.message);
            }
        }

        function startPolling() {
            stopPolling();
            pollTimer = setInterval(pollServer, 300);
        }

        function stopPolling() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        // 连接蓝牙
        async function connectBluetooth() {
            try {
                setStatus('🔍 正在扫描蓝牙设备…', 'info');
                
                // 关键：acceptAllDevices = true，显示所有设备
                device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
                });

                setStatus('🔗 正在连接 ' + device.name + '…', 'info');
                
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                characteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');

                setStatus('✅ 已连接：' + device.name, 'ok');
                connectBtn.textContent = '🔌 已连接，点击断开';
                connectBtn.disabled = false;
                connectBtn.onclick = disconnectBluetooth;

                await requestWakeLock();
                startPolling();
                startKeepAlive();

            } catch (err) {
                if (err.name === 'NotFoundError' || err.message.includes('cancelled')) {
                    setStatus('❌ 未选择设备或未找到，请确保玩具处于配对模式（灯快闪）', 'err');
                } else {
                    setStatus('❌ 连接失败: ' + err.message, 'err');
                }
                connectBtn.disabled = false;
            }
        }

        // 断开蓝牙
        async function disconnectBluetooth() {
            stopPolling();
            stopKeepAlive();
            currentCommand = null;
            if (device && device.gatt.connected) {
                device.gatt.disconnect();
            }
            characteristic = null;
            device = null;
            setStatus('🔌 已断开连接', 'info');
            connectBtn.textContent = '🔍 扫描并连接玩具';
            connectBtn.onclick = connectBluetooth;
            connectBtn.disabled = false;
        }

        // 初始绑定
        connectBtn.onclick = connectBluetooth;
    </script>
</body>
</html>
