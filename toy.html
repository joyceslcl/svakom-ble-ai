<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVAKOM ST462A 蓝牙中继</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d0d;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        h1 { text-align: center; font-size: 22px; margin-bottom: 4px; color: #ff6b9d; }
        .subtitle { text-align: center; font-size: 12px; color: #888; margin-bottom: 20px; }
        .status-bar {
            background: #252525;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #ff4444; flex-shrink: 0;
        }
        .status-dot.connected { background: #44ff44; }
        .btn {
            display: block; width: 100%; padding: 14px;
            border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            margin-bottom: 12px; transition: 0.2s;
        }
        .btn-scan { background: #7c3aed; color: #fff; }
        .btn-stop { background: #ff4444; color: #fff; }
        .btn:active { transform: scale(0.97); }
        .control-group { margin-bottom: 16px; }
        .control-label { font-size: 14px; color: #ccc; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .control-value { color: #ff6b9d; font-weight: bold; }
        input[type=range] {
            width: 100%; height: 8px; border-radius: 4px;
            -webkit-appearance: none; background: #333; outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 28px; height: 28px;
            border-radius: 50%; background: #ff6b9d; cursor: pointer;
        }
        select {
            width: 100%; padding: 12px; border-radius: 10px;
            background: #252525; color: #fff; border: 1px solid #444; font-size: 15px;
        }
        .log-box {
            margin-top: 16px; background: #111; border-radius: 10px;
            padding: 10px; max-height: 120px; overflow-y: auto;
            font-size: 11px; color: #666; font-family: monospace;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🧸 ST462A 中继</h1>
    <p class="subtitle">SVAKOM Klitty · 蓝牙 → Render</p>

    <div class="status-bar" id="statusBar">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">未连接</span>
    </div>

    <button class="btn btn-scan" id="scanBtn" onclick="scanAndConnect()">🔍 扫描并连接玩具</button>

    <div class="control-group">
        <div class="control-label"><span>💨 震动强度</span><span class="control-value" id="vibeLabel">0%</span></div>
        <input type="range" id="vibeSlider" min="0" max="100" value="0" oninput="onVibeChange(this.value)">
    </div>

    <div class="control-group">
        <div class="control-label"><span>🔒 吮吸档位</span><span class="control-value" id="suctLabel">关</span></div>
        <select id="suctSelect" onchange="onSuctChange(this.value)">
            <option value="0">关闭</option>
            <option value="1">第 1 档</option>
            <option value="2">第 2 档</option>
            <option value="3">第 3 档</option>
        </select>
    </div>

    <div class="control-group">
        <div class="control-label"><span>🔄 旋转速度</span><span class="control-value" id="rotLabel">0%</span></div>
        <input type="range" id="rotSlider" min="0" max="100" value="0" oninput="onRotChange(this.value)">
    </div>

    <button class="btn btn-stop" onclick="stopAll()">⏹ 全部停止</button>

    <div class="log-box" id="logBox">— 等待连接 —</div>
</div>

<script>
    // ==================== 配置 ====================
    const RELAY_URL = 'https://svakom-ble-ai-1.onrender.com';
    const SECRET = '200262zll';
    const SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
    const CHAR_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

    let device = null;
    let char = null;
    let currentState = { vibe: 0, suct: 0, rot: 0 };
    let lastCmd = null;
    let keepAliveTimer = null;
    let pollTimer = null;

    // ==================== UI 辅助 ====================
    function log(msg) {
        const box = document.getElementById('logBox');
        const time = new Date().toLocaleTimeString();
        box.textContent = '[' + time + '] ' + msg + '\n' + box.textContent;
        box.textContent = box.textContent.split('\n').slice(0, 30).join('\n');
    }
    function setStatus(connected, text) {
        const dot = document.getElementById('statusDot');
        const txt = document.getElementById('statusText');
        if (connected) { dot.classList.add('connected'); } else { dot.classList.remove('connected'); }
        txt.textContent = text;
    }

    // ==================== 蓝牙 ====================
    async function scanAndConnect() {
        try {
            log('正在扫描蓝牙设备...');
            setStatus(false, '扫描中...');
            device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [SERVICE_UUID]
            });
            log('已选择: ' + (device.name || '未知设备'));
            setStatus(false, '连接中...');

            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            char = await service.getCharacteristic(CHAR_UUID);

            setStatus(true, '已连接: ' + (device.name || 'ST462A'));
            log('✅ 蓝牙已连接！开始轮询中继...');

            device.addEventListener('gattserverdisconnected', onDisconnect);
            startKeepAlive();
            startPolling();
        } catch (err) {
            log('❌ 连接失败: ' + err.message);
            setStatus(false, '连接失败');
        }
    }
    function onDisconnect() {
        log('⚠ 蓝牙断开');
        setStatus(false, '已断开');
        stopKeepAlive();
        stopPolling();
        char = null;
        device = null;
    }

    // ==================== 命令构建（ST462A 协议） ====================
    function buildVibeCommand(intensity) {
        if (intensity <= 0) return new Uint8Array([0x55, 0x03, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00]);
        const y = Math.max(1, Math.min(10, Math.floor(intensity)));
        return new Uint8Array([0x55, 0x03, 0x00, 0x00, 0x01, y, y, 0x00]);
    }
    function buildSuctCommand(level) {
        if (level <= 0) return new Uint8Array([0x55, 0x09, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]);
        const x = Math.max(1, Math.min(3, level));
        return new Uint8Array([0x55, 0x09, 0x00, 0x00, x, 0x00, 0x00, 0x00]);
    }
    function buildRotCommand(speed) {
        if (speed <= 0) return new Uint8Array([0x55, 0x14, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00]);
        const y = Math.max(1, Math.min(10, Math.floor(speed)));
        return new Uint8Array([0x55, 0x14, 0x00, 0x00, 0x01, y, y, 0x00]);
    }
    function buildStopAll() {
        return new Uint8Array([0x55, 0xFF, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]);
    }

    // ==================== 发送命令 ====================
    async function sendCmd(cmdBytes) {
        if (!char) {
            log('⚠ 蓝牙未连接，命令进入队列');
            await queueToRelay(cmdBytes);
            return;
        }
        try {
            await char.writeValue(cmdBytes);
            lastCmd = cmdBytes;
            log('📤 已发送: ' + Array.from(cmdBytes).map(b => b.toString(16).padStart(2,'0')).join(' '));
        } catch (err) {
            log('❌ 发送失败: ' + err.message);
            await queueToRelay(cmdBytes);
        }
    }

    // ==================== 中继队列 ====================
    async function queueToRelay(cmdBytes) {
        const hex = Array.from(cmdBytes).map(b => b.toString(16).padStart(2,'0')).join('');
        try {
            await fetch(RELAY_URL + '/api/queue', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-secret': SECRET },
                body: JSON.stringify({ command: hex })
            });
        } catch (e) { log('⚠ 队列写入失败'); }
    }

    async function pollRelay() {
        try {
            const resp = await fetch(RELAY_URL + '/api/queue?secret=' + SECRET);
            const data = await resp.json();
            if (data.command && char) {
                const bytes = new Uint8Array(data.command.match(/.{1,2}/g).map(b => parseInt(b, 16)));
                await char.writeValue(bytes);
                lastCmd = bytes;
            }
        } catch (e) { /* 静默失败 */ }
    }
    function startPolling() { stopPolling(); pollTimer = setInterval(pollRelay, 300); }
    function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

    // ==================== 续命心跳 ====================
    function startKeepAlive() { stopKeepAlive(); keepAliveTimer = setInterval(() => { if (lastCmd && char) { char.writeValue(lastCmd).catch(() => {}); } }, 1500); }
    function stopKeepAlive() { if (keepAliveTimer) { clearInterval(keepAliveTimer); keepAliveTimer = null; } }

    // ==================== UI 事件 ====================
    function onVibeChange(val) {
        const pct = parseInt(val) / 100;
        currentState.vibe = pct;
        document.getElementById('vibeLabel').textContent = Math.round(pct * 100) + '%';
        const cmd = buildVibeCommand(Math.round(pct * 10));
        sendCmd(cmd);
    }
    function onSuctChange(val) {
        const level = parseInt(val);
        currentState.suct = level;
        const labels = ['关', '第 1 档', '第 2 档', '第 3 档'];
        document.getElementById('suctLabel').textContent = labels[level];
        const cmd = buildSuctCommand(level);
        sendCmd(cmd);
    }
    function onRotChange(val) {
        const pct = parseInt(val) / 100;
        currentState.rot = pct;
        document.getElementById('rotLabel').textContent = Math.round(pct * 100) + '%';
        const cmd = buildRotCommand(Math.round(pct * 10));
        sendCmd(cmd);
    }
    function stopAll() {
        currentState = { vibe: 0, suct: 0, rot: 0 };
        document.getElementById('vibeSlider').value = 0;
        document.getElementById('vibeLabel').textContent = '0%';
        document.getElementById('suctSelect').value = 0;
        document.getElementById('suctLabel').textContent = '关';
        document.getElementById('rotSlider').value = 0;
        document.getElementById('rotLabel').textContent = '0%';
        sendCmd(buildStopAll());
    }
</script>
</body>
</html>
